[project]
name = "swarm-studio"
version = "0.1.0"
description = "A native desktop desk for task-driven website reconstruction"
requires-python = ">=3.12"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Byte by Mint", email = "info@bytebymint.space"}]
dependencies = [
    "PySide6>=6.8,<7",
    "httpx>=0.28,<1",
    "beautifulsoup4>=4.13,<5",
    "lxml>=5.3,<7",
    "Pillow>=11,<13",
    "playwright>=1.50,<2",
    "av>=15,<20",
    "numpy>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.12,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
